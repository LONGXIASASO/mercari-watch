name: 卡市出口探测（临时）

# 只为查清：换成新订阅后卡市 4 个节点全部 -1 的原因（节点不通？还是站方拒绝？）
# 用完即删。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 起 Xray
        shell: bash
        env:
          POCA_SUB_URL: ${{ secrets.POCA_SUB_URL }}
        run: |
          curl -sSL -m 300 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
          mkdir -p /tmp/xray && unzip -oq /tmp/xray.zip -d /tmp/xray
          node poca/_sub2xray.js --out /tmp/xray.json --port 7891 2>&1 | head -20
          if [ ! -s /tmp/xray.json ]; then echo "::error::订阅解析失败"; exit 1; fi
          nohup /tmp/xray/xray.exe -c /tmp/xray.json > /tmp/xray.log 2>&1 &
          sleep 8
          echo "--- xray 日志 ---"; tail -8 /tmp/xray.log || true

      - name: 逐节点探测
        shell: bash
        run: |
          echo "===== 基线：直连 ====="
          node poca/poca.js --probe 2>&1 | tail -2 || true
          echo
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/xray.json'))['inbounds']))")
          echo "节点数: $N"
          for i in $(seq 0 $((N-1))); do
            P=$((7891+i))
            echo
            echo "===== 节点 :$P ====="
            echo -n "  出口 IP: "
            curl -s -m 12 -x "http://127.0.0.1:$P" https://ipinfo.io/json 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('ip'),d.get('country'),d.get('city'),d.get('org'))" 2>/dev/null || echo "拉不到"
            echo -n "  卡市端点: "
            POCA_HTTP=curl POCA_PROXY="http://127.0.0.1:$P" node poca/poca.js --probe 2>&1 | tail -1 || true
            echo -n "  curl 分阶段: "
            curl -sS -m 30 -x "http://127.0.0.1:$P" -o /dev/null \
              -w "http=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total} err=%{errmsg}\n" \
              "https://app.phocamarket.com/card/v3/search" 2>&1 | tail -1 || true
            echo -n "  IP 直连对比(无代理): "
            curl -sS -m 15 -o /dev/null -w "http=%{http_code} total=%{time_total}\n" "https://app.phocamarket.com/card/v3/search" 2>&1 | tail -1 || true
          done

      - name: Xray 日志尾部
        if: always()
        shell: bash
        run: tail -20 /tmp/xray.log || true
