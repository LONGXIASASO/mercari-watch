name: 卡市出口探测（临时）

# 只为查清：换成新订阅后卡市 4 个节点全部 -1 的原因（节点不通？还是站方拒绝？）
# 与生产同环境：windows-latest + Git Bash + Schannel curl。用完即删。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 起 Xray 并逐节点探测（同一 shell，路径用相对）
        shell: bash
        env:
          POCA_SUB_URL: ${{ secrets.POCA_SUB_URL }}
        run: |
          set +e
          curl -sSL -m 300 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
          mkdir -p xraybin && unzip -oq xray.zip -d xraybin
          node poca/_sub2xray.js --out xray.json --port 7891 2>&1 | head -20
          if [ ! -s xray.json ]; then echo "::error::订阅解析失败"; exit 1; fi
          ./xraybin/xray.exe -c xray.json > xray.log 2>&1 &
          sleep 8
          N=$(node -e "console.log(require('./xray.json').inbounds.length)")
          echo "节点数: $N"
          echo
          echo "===== 基线：直连（不挂代理） ====="
          node poca/poca.js --probe 2>&1 | tail -2
          echo
          for i in $(seq 0 $((N-1))); do
            P=$((7891+i))
            echo "===== 节点 :$P ====="
            echo -n "  出口 IP: "
            curl -s -m 12 -x "http://127.0.0.1:$P" https://ipinfo.io/json 2>/dev/null | head -c 200 | tr -d '\n'
            echo
            echo -n "  卡市 probe: "
            POCA_HTTP=curl POCA_PROXY="http://127.0.0.1:$P" node poca/poca.js --probe 2>&1 | tail -1
            echo -n "  curl 分阶段: "
            curl -sS -m 40 -x "http://127.0.0.1:$P" -o /dev/null \
              -w "http=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total} err=%{errormsg}\n" \
              "https://app.phocamarket.com/card/v3/search" 2>&1 | tail -1
            echo
          done
          echo "===== xray 日志尾部 ====="
          tail -12 xray.log
          kill %1 2>/dev/null
