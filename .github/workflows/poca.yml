name: Poca 卡市监控

# 抓 장하오 全量卡（约 1036 张），全天不停（含夜间）。
# ⚠️⚠️ 2026-11-13 15:35 起抓取范围收窄（用户定稿）：**自动轮次只抓搜索页，明细页留给周末手动跑**。
#    一轮 = 65 个搜索请求（8~17 秒），只刷新 匹配价 / 速切价 / 有货无货 三项。
#    挂单明细、匹配成交明细、速切成交、最高求购、库存件数 一律沿用上一轮，直到有人手动 deep=1。
#    原因：明细占全量请求 55%，是「换什么通道都被封」的主要诱因，历史上被封又恰好都在凌晨补量那次。
# ⚠️ 2026-11-12 16:00 起走 Cloudflare Worker 中转，出口不再是 Azure 机房 IP。
# ⚠️⚠️ 2026-11-12 18:30 起**已关闭 GitHub 自带 schedule**，只剩一条触发源：
#    cron-job.org 每 10 分钟 POST 一次 workflow_dispatch。
#    关掉的原因：GitHub cron 很不准（整点最挤，会推迟几十分钟甚至跳过），
#    而且它会和 cron-job.org 撞在同一时段——#2477 就是被撞车判「节流」吞掉的定时轮，
#    两条调度并存纯粹制造「以为 10 分钟一更、实际 20 分钟」的假象。
#    ⚠️ 代价：cron-job.org 是唯一触发源。那边一旦停用/额度用尽，抓取就整段停摆。
#      所以 _alert.js 的停更告警现在是唯一的兜底信号，别把它关掉。
#      （真要临时恢复，把下面 on: 里的 schedule 那两行放回来即可，
#        注意错开分钟数：'3,13,23,33,43,53'。）
#
# ⚠️ 触发时刻的约定（2026-11-12 17:50 记下，别忘）：
#    实测 cron-job.org 是在 :00 :10 :20 … 整十分触发的（#2465~#2472 时间戳可证），
#    一轮 75 秒 → 数据要到 :01:15 才发布，看起来就不像「整十分在更新」。
#    要做出整十分的体感，得把 **cron-job.org 那边的触发时刻**改成 :09 :19 :29 :39 :49 :59
#    （提前 1 分钟触发，跑完正好落在整十分之后）。这一步只能在 cron-job.org 网站上改。
#
# 收藏排名：一天只抓一次，安排在北京时间 1:30 之后那一场，其余轮次沿用缓存。

on:
  # ⚠️ 2026-11-12 18:30 关闭 GitHub 自带 schedule，唯一触发源改为 cron-job.org。
  #    原来这里是 - cron: '4,14,24,34,44,54 * * * *'
  #    要恢复就取消下面两行注释，分钟数务必与 cron-job.org 的 :09/:19/… 错开。
  # schedule:
  #   - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      skip_wish:
        description: '跳过收藏排名抓取（跳过后更快，排名沿用缓存）'
        required: false
        default: 'false'
        type: string
      notify_tag:
        description: '推送到钉钉时标题附带的标签（留空=正常消息；填「测试消息」= 测试用）'
        required: false
        default: ''
        type: string
      bootstrap:
        description: '⚠️ 仅在 poca-data 分支真的空掉时填 1：允许从零建档案（会覆盖旧档案）'
        required: false
        default: ''
        type: string
      force_mode:
        description: '手动指定出口：direct（直连）/ worker（CF 中转）/ sub（订阅）。留空=自动三级探测'
        required: false
        default: ''
        type: string
      runner:
        description: '⚠️ 一般留空，**必须是 windows-latest**（Ubuntu 的 OpenSSL curl 会被判 404/39，#2638 实测）。填 ubuntu-latest 只会让本轮失败'
        required: false
        default: ''
        type: string
      pin_detail:
        description: '✅ 常用：填 1 = 本轮只给「固定监控卡」（PINS 里那几张，目前 7 张）补一遍详情+挂单+成交明细，其它 1000 多张照旧只抓搜索。约 14 个额外请求，不触发风控'
        required: false
        default: ''
        type: string
      deep:
        description: '⚠️ 慎用：填 1 = 全站 1000+ 张卡都抓详情+明细（约 2500 请求，一次性调用）。平时补明细请用上面的 pin_detail'
        required: false
        default: ''
        type: string

concurrency:
  group: poca-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    # 🚨🚨 必须 windows-latest。2026-11-13 15:56 用 #2638 做了一次干净的对照实验，
    #    把「OS 是不是变量」这件事彻底钉死（别再改回 ubuntu，别再怀疑这条）：
    #      同一份订阅 → 同一份 /tmp/xray.json → 同一个韩国节点 :7891，只换 runner 操作系统：
    #        windows-latest + curl（Schannel）         → ✅ 200，16 条结果
    #        ubuntu-latest  + curl（OpenSSL）          → ❌ 404/39 NOT_FOUND，四个端口全灭
    #        ubuntu-latest  + node 内置 h2（OpenSSL）  → ❌ 404/39
    #        ubuntu-latest  + node http1（OpenSSL）    → ❌ 404/39
    #      xray 日志显示 connection accepted（隧道是通的，不是代理没起来）。
    #    ⇒ 判据是 **TLS 栈指纹**：Windows Schannel 放行，OpenSSL 系（Ubuntu 的 curl、node 的 h2/http1）
    #      一律被判 NOT_FOUND。跟出口 IP、AS 段、地区无关（同一节点同一个 IP）。
    #    ⇒ 所以「换 OS 没用、只有客户端 curl 有用」这句话是**错的**，别据此再切回 Linux。
    #      curl 换成 Windows 的只是必要条件的一半：curl + Schannel 缺一不可。
    #    ⇒ 代价接受：Windows 计费两倍（仓库公开不限量）、每轮多装一遍 sharp、总耗时约 170s。
    #    ⚠️ 下面的平台适配代码（xray.exe / taskkill / RUNNER_OS 判断）不是「兼容保留」，
    #      而是**当前实际执行路径**，删不得。
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 20
    # Windows runner 默认 shell 是 pwsh，下面全是 bash 脚本，所以统一指定。
    # （bash 由 Git for Windows 提供，与 _probe_win.sh 验证过的同一个；它的 curl 也是 Schannel）
    defaults:
      run:
        shell: bash
    steps:
      - name: 拉取脚本
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # ⚠️⚠️ 必须 22。2026-11-12 实测：同一个 runner、同一套请求头、同一个 UA，
          #    Node 20 → 整站 404/39 NOT_FOUND，Node 22 → 全 200。站方在 TLS 指纹层面分流，
          #    20 的指纹被丢到没有该路由的旧后端。降到 20（或换回 curl）都会立刻复现故障。
          node-version: '22'

      # 钉钉推送要把降价卡拼成集合图，需要 sharp（有预编译二进制，约 10 秒）
      - name: 安装 sharp（拼集合图用）
        continue-on-error: true
        run: npm install sharp --no-save --no-audit --no-fund

      - name: 取上一次的状态（poca-data 分支）
        run: |
          mkdir -p poca
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/poca-data"
          # ⚠️⚠️ 2026-11-06 17:40 事故复盘：这里原来是一次性 curl，失败就 rm 掉当「首次运行」，
          #    接着脚本从零播种，再把这份短档案 force push 覆盖上去 ——
          #    3304 个价格点被 1028 个冲掉，11-02～11-06 的所有价格变动永久丢失。
          #    现在：每个文件最多试 6 次；state.json / pchg.json 全试失败就整轮中止，
          #    绝不拿空档案去覆盖线上。真要从零建，手动 dispatch 时把 bootstrap 填 1。
          fetch() {
            local f="$1" url="$2" i code
            for i in 1 2 3 4 5 6; do
              code=$(curl -sSL --max-time 30 --retry 2 --retry-delay 1 -o "poca/$f" -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && [ -s "poca/$f" ]; then
                echo "  ✅ $f 第 $i 次拿到，$(stat -c%s "poca/$f") 字节"
                return 0
              fi
              echo "  ⚠️ $f 第 $i 次取不到（HTTP ${code:-timeout}），3 秒后重试"
              sleep 3
            done
            rm -f "poca/$f"
            return 1
          }
          HARD_FAIL=""
          fetch state.json "$BASE/state.json" || HARD_FAIL="$HARD_FAIL state.json"
          fetch pchg.json  "$BASE/pchg.json"  || HARD_FAIL="$HARD_FAIL pchg.json"
          # 明细永久档案 darc.json（挂单/成交累积，越过站方「最多 5 条」上限）。
          # 和 pchg 一样怕「空档案覆盖」：只有 HTTP 404（首次还没建）才允许当空档案起步，
          # 超时/5xx/403 一律重试到放弃 → 整轮中止，绝不拿空的把那几百条累积记录冲掉。
          fetch_darc() {
            local f="darc.json" url="$BASE/darc.json" i code
            for i in 1 2 3 4 5 6; do
              code=$(curl -sSL --max-time 30 --retry 2 --retry-delay 1 -o "poca/$f" -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && [ -s "poca/$f" ]; then
                echo "  ✅ $f 第 $i 次拿到，$(stat -c%s "poca/$f") 字节"
                return 0
              fi
              if [ "$code" = "404" ]; then
                echo "  ℹ️ $f 尚不存在（首次建明细档案），本轮从空开始累积"
                rm -f "poca/$f"
                return 0
              fi
              echo "  ⚠️ $f 第 $i 次取不到（HTTP ${code:-timeout}），3 秒后重试"
              sleep 3
            done
            rm -f "poca/$f"
            return 1
          }
          fetch_darc || HARD_FAIL="$HARD_FAIL darc.json"
          fetch wish.json  "$BASE/wish.json"  || echo "  wish.json 没有，本轮重抓收藏排名"
          # 星标清单存在 main 分支（poca/stars.json，由页面写入）。不能放 poca-data：
          # 那是每轮 force push 的单 commit 分支，会把它冲掉。
          fetch stars.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/poca/stars.json" \
            || echo "  stars.json 没有（还没同步过星标）"
          # 上一轮产物：跳过明细的轮次要沿用它的挂单/成交标记（darc 里没有「仍在挂」状态位，
          # 直接从档案重建会让页面挂单全部降成浅色，隔一轮闪一次）。拉不到就退回档案兜底。
          fetch data.prev.json "$BASE/data.json" \
            || echo "  ℹ️ 上一轮 data.json 没拿到，本轮若跳过明细会退回档案兜底"

          # 订阅兜底的计时（2026-11-13）：记录「上一次用订阅抓取成功」的 epoch 秒，
          # 预检的 ③ 阶段靠它做 20 分钟节流。缺了不影响 A/B 两级，所以只做软提示。
          fetch_opt() {
            local f="$1" url="$2" code
            code=$(curl -sSL --max-time 20 -o "poca/$f" -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && [ -s "poca/$f" ]; then
              echo "  ✅ $f $(cat "poca/$f")"
            elif [ "$code" = "404" ]; then
              rm -f "poca/$f"; echo "  ℹ️ $f 尚不存在（本轮允许用订阅兜底）"
            else
              # 取不到时**保留本地**（不存在就空）→ 下一轮可能提前用订阅，可接受
              rm -f "poca/$f"; echo "  ⚠️ $f 取不到（HTTP ${code:-timeout}）"
            fi
          }
          fetch_opt subat.txt "$BASE/subat.txt"

          if [ -n "$HARD_FAIL" ]; then
            if [ "${{ github.event.inputs.bootstrap }}" = "1" ]; then
              echo "::warning::state/pchg 取不到（$HARD_FAIL），但 bootstrap=1，允许从零建档案"
              rm -f poca/state.json poca/pchg.json poca/darc.json
            else
              echo "::error::poca-data 上的$HARD_FAIL 重试 6 次仍取不到 —— 本轮中止，绝不用空档案覆盖线上。确需从零建，请手动触发并填 bootstrap=1"
              exit 1
            fi
          fi
          ls -la poca/

      - name: 判断收藏排名是否要重抓（一天一次，安排在北京 1:30 之后那一场）
        id: wish
        run: |
          # 收藏数变化很慢，每天抓一次就够。
          # 默认沿用缓存；命中以下任一条件才重抓：
          #   ① 没有缓存（首次运行）
          #   ② 当前是 UTC 17:30 之后 = 北京时间 1:30 之后（当天最后一段），且距上次已超 6 小时
          #      —— 加 AGE 判断是为了别在同一段的 3 个轮次里连抓 3 次
          #   ③ 缓存已经超过 24 小时（某一场漏了，兜底补上）
          SKIP="1"
          if [ ! -f poca/wish.json ]; then
            SKIP=""
            echo "→ 没有缓存，本轮抓取收藏排名"
          else
            AGE=$(node -e "try{const w=require('./poca/wish.json');process.stdout.write(String(Math.floor((Date.now()-new Date(w.at))/3600000)))}catch(e){process.stdout.write('999')}")
            H=$(date -u +%H); M=$(date -u +%M)
            if [ "$H" = "17" ] && [ "$M" -ge 30 ] && [ "$AGE" -ge 6 ]; then
              SKIP=""
              echo "→ 当天最后一段（北京时间 1:30 之后），刷新收藏排名"
            fi
            if [ "$AGE" -ge 24 ]; then
              SKIP=""
              echo "→ 缓存已 ${AGE} 小时，超过 24 小时，强制刷新收藏排名"
            fi
            if [ "$SKIP" = "1" ]; then echo "→ 缓存 ${AGE} 小时，收藏排名沿用"; fi
          fi
          if [ "${{ github.event.inputs.skip_wish }}" = "true" ]; then SKIP="1"; echo "→ 手动指定跳过收藏排名"; fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # ⚠️ 自检的目的只有一个：出事时能在日志里**一眼看出是哪一层坏了**。
      #    2026-11-11：node 404 / curl 200 → 以为是传输层，改用 h2。
      #    2026-11-12：两个传输层都 404、连首页都 404 → 以为是 UA；
      #                最后 A/B 出真相：**同一个 runner，Node 20 全 404、Node 22 全 200**。
      #    所以现在自检必须用与抓取相同的客户端（node），并且必须打印 Node 版本。
      - name: 出口网络自检（Node 版本 / 出口 IP / 两种 UA）
        run: node poca/_selfcheck.js

      # ⚠️⚠️ 2026-11-13 10:10 用户定的三级降级策略（每轮都从 ① 重新探起，一恢复就回免费通道）：
      #    ① 机房直连（Azure 出口）—— 站方放行时用它，最快最省，0 成本
      #    ② Cloudflare 中转 —— 白天机房 IP 被拦时用它（免费额度 10 万/天，一轮 65 次）
      #    ③ 订阅兜底（用户机场的**韩国**节点，runner 上起 Xray 做本地 http 代理）
      #       只在前两级都不通时启用。⚠️ 2026-11-13 12:00 用户取消了「20 分钟才允许用一次」的节流，
      #       现在和别的通道一样，靠外部 10 分钟定时器触发节奏（仍受 --min-gap 2 防重入保护）。
      #       subat.txt 只作「上次用订阅是什么时候」的记录，不再参与任何判断。
      #       用完立刻 kill，下一轮照样先探 ① ②，绝不让订阅长期顶班、也不多占她的设备位。
      # ⚠️⚠️ 探测和抓取**必须用同一个客户端 curl**（2026-11-13 15:05 实测）：
      #    同一个韩国节点 —— curl 出去 200 / 7768 字节；node 内置 http2 出去 404/39。
      #    所以 `--probe` 也走 curl（poca.js 里 TRANSPORT 默认就是 curl，不再回退 h2）。
      # ⚠️⚠️ 但「跟操作系统无关」这句是错的，#2638（15:56）已当场推翻：
      #    同一份订阅、同一节点，Ubuntu 的 curl（OpenSSL）四种客户端全 404/39，
      #    Windows 的 curl（Schannel）200。⇒ curl + Schannel 两个条件缺一不可，
      #    详见上面 runs-on 那段注释，别再据此切回 ubuntu。
      - name: 通路预检 + 抓取（① 直连 → ② 中转 → ③ 订阅兜底）
        id: gate
        env:
          POCA_SUB_URL: ${{ secrets.POCA_SUB_URL }}
          FORCE: ${{ github.event.inputs.force_mode }}
          POCA_Q: 장하오
          # 固定监控卡单独补明细（2026-11-13 18:20）。留空=关。
          # 只给 PINS 里那 7 张发明细请求（约 14 个），其它 1000 多张卡照旧只抓搜索。
          POCA_PIN_DETAIL: ${{ github.event.inputs.pin_detail }}
        run: |
          MODE=""; PROXYURL=""; FOUND=""; REASON=""; DETAIL=""
          # ── 平台适配（windows-latest 是当前实际执行路径，#2638 之后不要再删）──
          # xray 可执行文件在 Windows 上带 .exe；关进程不能用 pkill（Git Bash 里没有）。
          # ⚠️ 这不只是「为 Windows 写的兼容分支」：整个 job 就只在 windows-latest 上跑，
          #    Ubuntu 的 OpenSSL curl 经同一隧道一律 404/39（#2638 对照实验）。
          if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then XRAY=/tmp/xray/xray.exe; else XRAY=/tmp/xray/xray; fi
          XRAY_PID=""
          xray_stop() {
            if [ -n "$XRAY_PID" ]; then kill "$XRAY_PID" 2>/dev/null || true; XRAY_PID=""; fi
            if [ "${RUNNER_OS:-Linux}" = "Windows" ]; then
              taskkill //F //IM xray.exe >/dev/null 2>&1 || true
            else
              pkill -f '/tmp/xray/xray' >/dev/null 2>&1 || true
            fi
          }
          # ⚠️ 探测一律带 POCA_HTTP=curl。2026-11-13 15:05 实测（#2626 客户端矩阵 + Windows runner 复验）：
          #    同一个韩国出口，curl 200 / node 内置 h2 404，站方按客户端 TLS 指纹分流。
          #    探测客户端必须与抓取客户端一致，否则会把好通道误判成「不通」。
          probe() { POCA_HTTP=curl node poca/poca.js --probe > /tmp/probe.out 2>&1; }
          lastline() { tail -1 /tmp/probe.out | sed 's/^ *//'; }

          # ───────── ① 机房直连 ─────────
          if probe; then
            MODE="direct"; DETAIL="直连 $(lastline)"
            echo "① 直连：$(lastline)"
          else
            echo "① 直连：$(lastline)"
          fi

          # ───────── ② Cloudflare 中转 ─────────
          # Worker 里的 KEYS 曾经和 workflow 常量对不上（403 + 体 9 字节 forbidden），
          # 所以候选 key 全试一遍，命中哪个用哪个，并把命中的写进环境交给抓取步骤。
          if [ -z "$MODE" ]; then
            for K in poca_9f3k2m7xq4wzv8hd; do
              if POCA_HOST=poca-proxy.1140382718.workers.dev POCA_KEY="$K" POCA_BATCH=0 probe; then
                FOUND="$K"; echo "② 中转 key=$K：$(lastline)"; break
              fi
              echo "② 中转 key=$K：$(lastline)"
            done
            if [ -n "$FOUND" ]; then
              MODE="worker"; DETAIL="中转 $(lastline)"
              # 批量端点单独验：这是我们自己的代码，坏了必须吵（20 路探，和实际批大小一致）
              ARR=""
              for i in $(seq 1 20); do
                if [ -z "$ARR" ]; then ARR='"/card/v1/436791"'; else ARR="$ARR,\"/card/v1/436791\""; fi
              done
              BCODE=$(curl -sS -m 40 -o /tmp/gate_b.bin -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' -H "x-poca-key: $FOUND" \
                -d "{\"ps\":[$ARR]}" 'https://poca-proxy.1140382718.workers.dev/__batch' || echo 000)
              echo "批量端点(20路) HTTP $BCODE 大小 $(stat -c%s /tmp/gate_b.bin 2>/dev/null || echo 0)"
              if [ "$BCODE" != "200" ] || ! grep -q '"r"' /tmp/gate_b.bin 2>/dev/null; then
                echo "GATE_URGENT=1" >> "$GITHUB_ENV"
                echo "GATE_REASON=BATCH" >> "$GITHUB_ENV"
                echo "GATE_DETAIL=批量端点 HTTP $BCODE" >> "$GITHUB_ENV"
                echo "::error::批量端点 /__batch 不可用（HTTP $BCODE）—— Cloudflare Worker 需要重新粘贴带批量端点的代码"
                exit 1
              fi
            else
              # 三种「不像 200」必须分清：404/39 NOT_FOUND=地区分流（换出口）、
              # 404 或 409 + 1~2 字节空体=限速（会自愈）、403 + 9 字节 forbidden=我们自己的鉴权（改代码）
              DETAIL="② 中转 $(lastline)"
              if grep -q '403/9' /tmp/probe.out; then
                REASON="AUTH"
              elif grep -q '404/39' /tmp/probe.out; then
                REASON="REGION"
              elif grep -qE '(404|429)/(1|2)\[|(404|429)/(1|2)$' /tmp/probe.out; then
                REASON="RATE_LIMIT"
              elif grep -qE ' → 0/| → -1/' /tmp/probe.out; then
                REASON="NETWORK"
              else
                REASON="UNKNOWN"
              fi
              if [ "$REASON" = "AUTH" ]; then
                echo "GATE_URGENT=1" >> "$GITHUB_ENV"
                echo "GATE_REASON=AUTH" >> "$GITHUB_ENV"
                echo "GATE_DETAIL=$DETAIL"
                echo "::error::Worker 鉴权失败（403 forbidden）—— Cloudflare 里的 KEYS 被改成了非空，或与 workflow 不一致"
                exit 1
              fi
            fi
          fi

          # ───────── ③ 订阅兜底（2026-11-13 取消 20 分钟节流，与其他轮同一节奏）─────────
          if [ -z "$MODE" ]; then
            if [ -z "$POCA_SUB_URL" ]; then
              REASON="NO_SUB"; DETAIL="$DETAIL ｜ 未配置 POCA_SUB_URL，跳过订阅兜底"
            else
              echo "③ 订阅兜底：准备 Xray"
              if [ ! -f "$XRAY" ]; then
                case "${RUNNER_OS:-Linux}" in
                  Windows) XZ=Xray-windows-64.zip ;;
                  *)       XZ=Xray-linux-64.zip ;;
                esac
                echo "  下载 $XZ"
                curl -sSL -m 180 -o /tmp/xray.zip \
                  "https://github.com/XTLS/Xray-core/releases/latest/download/$XZ"
                mkdir -p /tmp/xray && unzip -oq /tmp/xray.zip -d /tmp/xray
              fi
              node poca/_sub2xray.js --out /tmp/xray.json || true
              if [ -s /tmp/xray.json ]; then
                "$XRAY" -c /tmp/xray.json > /tmp/xray.log 2>&1 &
                XRAY_PID=$!
                sleep 4
                for P in 7891 7892 7893 7894; do
                  if POCA_PROXY="http://127.0.0.1:$P" probe; then
                    PROXYURL="http://127.0.0.1:$P"; MODE="sub"; DETAIL="订阅 :$P $(lastline)"
                    echo "③ 订阅 :$P：$(lastline)"
                    break
                  fi
                  echo "③ 订阅 :$P：$(lastline)"
                done
                # ── 客户端矩阵诊断（2026-11-13 15:05 加）──
                # 站方按客户端 TLS 指纹分流：curl 200、node+h2 404。
                # 全不通时把三种客户端各探一次，一轮就能分清「客户端选错」还是「出口废了」。
                if [ -z "$MODE" ]; then
                  echo "🔬 客户端矩阵诊断（同一节点 :7891）"
                  for T in curl h2 http1; do
                    POCA_HTTP=$T POCA_PROXY=http://127.0.0.1:7891 node poca/poca.js --probe > /tmp/pm_$T.out 2>&1 || true
                    echo "   [$T] $(tail -1 /tmp/pm_$T.out | sed 's/^ *//')"
                  done
                  if grep -qhE '探测通过' /tmp/pm_*.out 2>/dev/null; then
                    echo "   ⚠️ 矩阵里有能过的客户端 → 抓取应固定用它（POCA_HTTP）"
                  else
                    echo "   ⚠️ 三种客户端全 404 → 这个出口环境已整体不可用"
                  fi
                  echo "   xray 日志末尾："
                  tail -5 /tmp/xray.log 2>/dev/null | sed 's/^/     /' || true
                fi
                # 探测完就关，抓取段会按同一份配置重新拉起（不赌后台进程跨段存活）
                xray_stop
              fi
                if [ -z "$MODE" ]; then
                  REASON="SUB_FAIL"; DETAIL="$DETAIL ｜ 订阅节点全不通"
                fi
            fi
          fi

          # ───────── 结论 ─────────
          if [ -n "$MODE" ]; then
            echo "✅ 本轮出口：$MODE（$DETAIL）"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "proxy=$PROXYURL" >> "$GITHUB_OUTPUT"
            echo "GATE_MODE=$MODE" >> "$GITHUB_ENV"
            if [ -n "$FOUND" ]; then echo "GATEKEY=$FOUND" >> "$GITHUB_ENV"; fi
            if [ -n "$PROXYURL" ]; then echo "GATE_PROXY=$PROXYURL" >> "$GITHUB_ENV"; fi
            if [ "$MODE" = "sub" ]; then
              echo "::warning::本轮机房直连 + CF 中转都不通，已启用订阅兜底（20 分钟内不会再用）"
            fi
          else
            echo "⏭ 三级出口全不通（原因 ${REASON:-UNKNOWN}）$DETAIL，本轮静默跳过"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "GATE_REASON=${REASON:-UNKNOWN}" >> "$GITHUB_ENV"
            echo "GATE_DETAIL=$DETAIL" >> "$GITHUB_ENV"
          fi

          # ══════════ 抓取（原独立 step，2026-11-13 15:20 合并进来）══════════
          # 合并原因：Windows runner 上跨 step 的后台进程不可靠（xray、pkill 都依赖它），
          # 放进同一个 shell 里，进程生命周期自己管，抓完立刻关。
          if [ "$MODE" = "none" ]; then echo "⏭ 三级出口全不通，跳过抓取"; exit 0; fi
          # ⚠️⚠️ 传输层固定 curl（2026-11-13 15:05 实测，不要改回 h2）：
          #    同一个韩国出口 64.176.234.49，curl → 200 / node 内置 http2 → 404/39。
          #    站方按客户端 TLS 指纹分流。node h2 从 13:10 起全线被判 NOT_FOUND。
          export POCA_HTTP=curl
          # ── 并发按出口给，别再一刀切 ──
          # ① 直连：curl 每请求一个进程，并发 8
          # ② 中转：批量 20 路 × 2 批在飞 = 等效上游 40 并发，搜索用 16
          # ③ 订阅：curl 经本地 Xray 的 CONNECT 隧道，站方没有 /__batch 所以禁批量；
          #    搜索 4、明细 6（2026-11-13 降速防特征，约 11 req/s）
          case "$MODE" in
            worker)
              export POCA_HOST=poca-proxy.1140382718.workers.dev
              export POCA_KEY="$FOUND"
              export POCA_BATCH=20
              export POCA_BATCH_CONC=2
              export POCA_CONC=16
              ;;
            sub)
              # ⚠️ 预检那次起的 xray 已经关了（不赌后台进程能跨段存活），这里按同一份
              #    /tmp/xray.json 重新拉起；起好再抓，抓完立刻关，绝不留后台连接占她的设备位。
              if [ ! -s /tmp/xray.json ]; then
                echo "::error::/tmp/xray.json 没了，订阅出口起不来"
                exit 1
              fi
              "$XRAY" -c /tmp/xray.json > /tmp/xray.log 2>&1 &
              XRAY_PID=$!
              PORT="${PROXYURL##*:}"
              for i in $(seq 1 30); do
                (echo > /dev/tcp/127.0.0.1/"$PORT") >/dev/null 2>&1 && break
                sleep 0.5
              done
              export POCA_PROXY="$PROXYURL"
              export POCA_BATCH=0        # 站方没有 /__batch，走代理必须关批量
              # 2026-11-13 10:47 用户要求降并发：原来搜索 8 + 明细 12，一轮 1037 请求 45 秒跑完
              #   ≈ 23 req/s，是全链路里最像爬虫的特征。降到 搜索 4 + 明细 6 ≈ 11 req/s，
              #   一轮 80~90 秒；对「10 分钟一轮」毫无影响，但对她机场流量、站方风控都温和得多。
              export POCA_CONC=4
              export POCA_CONC_DET=6
              echo "订阅出口就绪：$POCA_PROXY"
              ;;
            *)
              export POCA_CONC=8
              ;;
          esac
          echo "出口模式=$MODE · 传输=curl · POCA_HOST=${POCA_HOST:-phocamarket.com} · POCA_PROXY=${POCA_PROXY:-无}"

          # ⚠️ --min-gap = 2（2026-11-12 18:45 用户指定，原为 5；历史上绝不能回到 8）：
          #    计时起点是**上一轮抓取写完盘的时刻**（state.json 的 at，不是开始时间）。
          #    这个值纯粹是「防同一次调度重复进来」的保险：手动触发、cron-job.org 重试、
          #    连点两次，间隔都在 0~1 分钟，2 分钟足够挡。正常 10 分钟节奏一轮 70~90s，
          #    实际间隔约 8.5 分钟，远大于 2，不会误伤。设 8 会周期性吞掉正常定时轮。
          # ⚠️⚠️ 2026-11-13 15:35 最终定稿：**所有自动轮次一律只抓搜索页，永不碰明细页**。
          #    用户的判断（对）：明细页占全量请求的 55%，是唯一能把量降一个数量级的开关，
          #    也正是「换什么通道都被封」的诱因。所以自动轮次恒定 --skip-detail。
          #
          #    常规轮（cron-job.org 每 10 分钟触发）= --skip-detail：
          #      只发 65 个搜索请求（原 1102，-94%，约 8~17 秒跑完）
          #      → 匹配价 transaction_sell_price / 速切价 offer_price / 有货无货 is_stocked
          #        每轮实时更新（这三个就是她真正要看的；已实测与详情接口 10/10 一致）
          #      → 挂单明细 / 匹配成交明细 / 速切成交 / 最高求购 / 库存件数 沿用上一轮，不刷新
          #
          #    明细改为**周更**：周末用户手动触发一次，把下面的 deep 填 1 → 本轮走全量补一遍。
          #
          #    ⚠️⚠️ 原来这里有两条「自动补全量」的路径，**已彻底删除，不要再加回来**：
          #        ① 0 点轮抓全量（HOUR=00 且 MIN<20）
          #        ② 距上次明细 deepAt > 25 小时就补一次全量
          #      它们会让每天凌晨自动冒出一个 1000+ 请求的尖峰，恰好落在韩国上班时间前后，
          #      正是这两个月反复被封的时间点。要明细只有一条路：手动 deep=1。
          if [ "${{ github.event.inputs.deep }}" = "1" ]; then
            LITE_ARGS=""
            echo "🔎 手动全量轮（deep=1）：搜索 + 单卡详情 + 挂单/成交明细"
          else
            LITE_ARGS="--skip-detail"
            echo "⚡ 常规轮：--skip-detail（只抓 65 页搜索；匹配价/速切价/有货/无货每轮更新，明细留给周末手动跑）"
          fi
          set +e
          if [ "${{ steps.wish.outputs.skip }}" = "1" ]; then
            node poca/poca.js --min-gap 2 $LITE_ARGS --skip-wish
          else
            node poca/poca.js --min-gap 2 $LITE_ARGS
          fi
          RC=$?
          set -e
          # 订阅模式无论成败都立刻关代理
          if [ "$MODE" = "sub" ]; then xray_stop; fi
          exit $RC

      - name: 确认产物
        run: |
          # 被节流跳过时没有新的 data.json，直接结束本轮（不算失败）
          if [ ! -s poca/data.json ]; then
            echo "⏭ 本轮跳过（距上次成功不足 2 分钟，节流），没有新产物"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          node -e "const d=require('./poca/data.json'); console.log('条数',d.items.length,'抓取用时',d.elapsed+'s','更新于',d.at_cn)"

      # ⚠️ 告警只做一件事：数据停了让你知道，同时不刷屏。
      #    判据是「距上次成功更新多久」，而不是「本轮成没成功」——
      #    限速一般几分钟自愈，按轮次告会 10 分钟一条，纯噪音。
      #    < 40 分钟不发；40~46 分钟发一条；之后每满 60 分钟再提醒一次。
      #    阈值、原因分类文案都在 poca/_alert.js 里，要调改那里。
      #    预检失败的原因（RATE_LIMIT / REGION / AUTH …）由上面的步骤写进 GATE_REASON。
      - name: 异常告警（停更 / 限速 / 代码问题）
        if: always()
        continue-on-error: true
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          POCA_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          JOB_STATUS: ${{ job.status }}
        run: node poca/_alert.js

      - name: 推送降价到钉钉
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          POCA_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
          POCA_NOTIFY_TAG: ${{ github.event.inputs.notify_tag }}
          # 集合图要传到 main 的 poca/notify/（poca-data 每轮 force push 会把图冲掉）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node poca/notify.js

      - name: 发布到 poca-data 分支
        if: env.SKIP != '1'
        run: |
          mkdir -p /tmp/pub
          cp poca/data.json poca/state.json /tmp/pub/
          [ -f poca/wish.json ] && cp poca/wish.json /tmp/pub/
          # 永久价格档案：单独文件，越滚越大，不能塞进 state.json
          if [ -f poca/pchg.json ]; then cp poca/pchg.json /tmp/pub/; fi
          # 永久明细档案：同样单独文件，只增不减
          if [ -f poca/darc.json ]; then cp poca/darc.json /tmp/pub/; fi
          # 订阅兜底计时：本轮真用了订阅就刷新，否则沿用旧值（poca-data 每轮 force push，
          # 不带就会被冲掉，下次节流就失效了）
          if [ "$GATE_MODE" = "sub" ]; then
            date +%s > /tmp/pub/subat.txt
            echo "订阅兜底计时刷新 → $(cat /tmp/pub/subat.txt)"
          elif [ -f poca/subat.txt ]; then
            cp poca/subat.txt /tmp/pub/
            echo "订阅兜底计时沿用 → $(cat /tmp/pub/subat.txt)"
          fi
          cd /tmp/pub
          git init -q -b poca-data
          git config user.name "poca-watch-bot"
          git config user.email "poca-watch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "poca $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 每轮 force push 单个 commit：仓库历史永远只有一条，不会随小时数膨胀
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/poca-data
          echo "✅ 已发布到 poca-data"
