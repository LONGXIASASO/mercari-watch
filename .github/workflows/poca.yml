name: Poca 卡市监控

# 抓 장하오 全量卡（约 1036 张），全天不停（含夜间）。
# ⚠️ 2026-11-12 16:00 起走 Cloudflare Worker 中转，出口不再是 Azure 机房 IP。
#    每轮全量：价格 + 求购 + 成交 + 库存件数 + 挂单明细，全部 10 分钟一更（一轮约 75 秒）。
#    一轮约 187 次 Worker 请求（批量 20 路/次），一天 2.7 万，免费额度 10 万里余量七成。
# GitHub 自带 schedule 很不准（整点最挤，可能推迟几十分钟甚至跳过），
# 所以主力仍是 cron-job.org 每 10 分钟 POST 一次 workflow_dispatch，schedule 只当兜底。
# 两条调度会互相撞：脚本内部 --min-gap 5 会挡住同一时段的重复触发，
# 不会挡掉正常的一轮（单轮约 75 秒）。
#
# ⚠️ 触发时刻的约定（2026-11-12 17:50 记下，别忘）：
#    实测 cron-job.org 是在 :00 :10 :20 … 整十分触发的（#2465~#2472 时间戳可证），
#    一轮 75 秒 → 数据要到 :01:15 才发布，看起来就不像「整十分在更新」。
#    要做出整十分的体感，得把 **cron-job.org 那边的触发时刻**改成 :09 :19 :29 :39 :49 :59
#    （提前 1 分钟触发，跑完正好落在整十分之后）。
#    改的同时这条 cron 要跟着错开成 '03,13,23,33,43,53'（比外部早 6 分钟，
#    它那一次会被 --min-gap 5 挡掉，等于纯兜底）。
#    目前**故意没改**：并发还是 2，先按现状跑一段观察限速情况。
#
# 收藏排名：一天只抓一次，安排在北京时间 1:30 之后那一场，其余轮次沿用缓存。

on:
  schedule:
    # 全天每 10 分钟一次。分钟数特意用 4/14/24…，与 cron-job.org 外部定时器的
    # :10 :20 :30… 错开 4~6 分钟 —— 同一分钟进来两个 dispatch 会被 concurrency 排队、
    # 后到的那次白跑一遍。改这里时务必继续错开。
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      skip_wish:
        description: '跳过收藏排名抓取（跳过后更快，排名沿用缓存）'
        required: false
        default: 'false'
        type: string
      notify_tag:
        description: '推送到钉钉时标题附带的标签（留空=正常消息；填「测试消息」= 测试用）'
        required: false
        default: ''
        type: string
      bootstrap:
        description: '⚠️ 仅在 poca-data 分支真的空掉时填 1：允许从零建档案（会覆盖旧档案）'
        required: false
        default: ''
        type: string

concurrency:
  group: poca-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 拉取脚本
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # ⚠️⚠️ 必须 22。2026-11-12 实测：同一个 runner、同一套请求头、同一个 UA，
          #    Node 20 → 整站 404/39 NOT_FOUND，Node 22 → 全 200。站方在 TLS 指纹层面分流，
          #    20 的指纹被丢到没有该路由的旧后端。降到 20（或换回 curl）都会立刻复现故障。
          node-version: '22'

      # 钉钉推送要把降价卡拼成集合图，需要 sharp（有预编译二进制，约 10 秒）
      - name: 安装 sharp（拼集合图用）
        continue-on-error: true
        run: npm install sharp --no-save --no-audit --no-fund

      - name: 取上一次的状态（poca-data 分支）
        run: |
          mkdir -p poca
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/poca-data"
          # ⚠️⚠️ 2026-11-06 17:40 事故复盘：这里原来是一次性 curl，失败就 rm 掉当「首次运行」，
          #    接着脚本从零播种，再把这份短档案 force push 覆盖上去 ——
          #    3304 个价格点被 1028 个冲掉，11-02～11-06 的所有价格变动永久丢失。
          #    现在：每个文件最多试 6 次；state.json / pchg.json 全试失败就整轮中止，
          #    绝不拿空档案去覆盖线上。真要从零建，手动 dispatch 时把 bootstrap 填 1。
          fetch() {
            local f="$1" url="$2" i code
            for i in 1 2 3 4 5 6; do
              code=$(curl -sSL --max-time 30 --retry 2 --retry-delay 1 -o "poca/$f" -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && [ -s "poca/$f" ]; then
                echo "  ✅ $f 第 $i 次拿到，$(stat -c%s "poca/$f") 字节"
                return 0
              fi
              echo "  ⚠️ $f 第 $i 次取不到（HTTP ${code:-timeout}），3 秒后重试"
              sleep 3
            done
            rm -f "poca/$f"
            return 1
          }
          HARD_FAIL=""
          fetch state.json "$BASE/state.json" || HARD_FAIL="$HARD_FAIL state.json"
          fetch pchg.json  "$BASE/pchg.json"  || HARD_FAIL="$HARD_FAIL pchg.json"
          # 明细永久档案 darc.json（挂单/成交累积，越过站方「最多 5 条」上限）。
          # 和 pchg 一样怕「空档案覆盖」：只有 HTTP 404（首次还没建）才允许当空档案起步，
          # 超时/5xx/403 一律重试到放弃 → 整轮中止，绝不拿空的把那几百条累积记录冲掉。
          fetch_darc() {
            local f="darc.json" url="$BASE/darc.json" i code
            for i in 1 2 3 4 5 6; do
              code=$(curl -sSL --max-time 30 --retry 2 --retry-delay 1 -o "poca/$f" -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && [ -s "poca/$f" ]; then
                echo "  ✅ $f 第 $i 次拿到，$(stat -c%s "poca/$f") 字节"
                return 0
              fi
              if [ "$code" = "404" ]; then
                echo "  ℹ️ $f 尚不存在（首次建明细档案），本轮从空开始累积"
                rm -f "poca/$f"
                return 0
              fi
              echo "  ⚠️ $f 第 $i 次取不到（HTTP ${code:-timeout}），3 秒后重试"
              sleep 3
            done
            rm -f "poca/$f"
            return 1
          }
          fetch_darc || HARD_FAIL="$HARD_FAIL darc.json"
          fetch wish.json  "$BASE/wish.json"  || echo "  wish.json 没有，本轮重抓收藏排名"
          # 星标清单存在 main 分支（poca/stars.json，由页面写入）。不能放 poca-data：
          # 那是每轮 force push 的单 commit 分支，会把它冲掉。
          fetch stars.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/poca/stars.json" \
            || echo "  stars.json 没有（还没同步过星标）"
          # 上一轮产物：跳过明细的轮次要沿用它的挂单/成交标记（darc 里没有「仍在挂」状态位，
          # 直接从档案重建会让页面挂单全部降成浅色，隔一轮闪一次）。拉不到就退回档案兜底。
          fetch data.prev.json "$BASE/data.json" \
            || echo "  ℹ️ 上一轮 data.json 没拿到，本轮若跳过明细会退回档案兜底"

          if [ -n "$HARD_FAIL" ]; then
            if [ "${{ github.event.inputs.bootstrap }}" = "1" ]; then
              echo "::warning::state/pchg 取不到（$HARD_FAIL），但 bootstrap=1，允许从零建档案"
              rm -f poca/state.json poca/pchg.json poca/darc.json
            else
              echo "::error::poca-data 上的$HARD_FAIL 重试 6 次仍取不到 —— 本轮中止，绝不用空档案覆盖线上。确需从零建，请手动触发并填 bootstrap=1"
              exit 1
            fi
          fi
          ls -la poca/

      - name: 判断收藏排名是否要重抓（一天一次，安排在北京 1:30 之后那一场）
        id: wish
        run: |
          # 收藏数变化很慢，每天抓一次就够。
          # 默认沿用缓存；命中以下任一条件才重抓：
          #   ① 没有缓存（首次运行）
          #   ② 当前是 UTC 17:30 之后 = 北京时间 1:30 之后（当天最后一段），且距上次已超 6 小时
          #      —— 加 AGE 判断是为了别在同一段的 3 个轮次里连抓 3 次
          #   ③ 缓存已经超过 24 小时（某一场漏了，兜底补上）
          SKIP="1"
          if [ ! -f poca/wish.json ]; then
            SKIP=""
            echo "→ 没有缓存，本轮抓取收藏排名"
          else
            AGE=$(node -e "try{const w=require('./poca/wish.json');process.stdout.write(String(Math.floor((Date.now()-new Date(w.at))/3600000)))}catch(e){process.stdout.write('999')}")
            H=$(date -u +%H); M=$(date -u +%M)
            if [ "$H" = "17" ] && [ "$M" -ge 30 ] && [ "$AGE" -ge 6 ]; then
              SKIP=""
              echo "→ 当天最后一段（北京时间 1:30 之后），刷新收藏排名"
            fi
            if [ "$AGE" -ge 24 ]; then
              SKIP=""
              echo "→ 缓存已 ${AGE} 小时，超过 24 小时，强制刷新收藏排名"
            fi
            if [ "$SKIP" = "1" ]; then echo "→ 缓存 ${AGE} 小时，收藏排名沿用"; fi
          fi
          if [ "${{ github.event.inputs.skip_wish }}" = "true" ]; then SKIP="1"; echo "→ 手动指定跳过收藏排名"; fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # ⚠️ 自检的目的只有一个：出事时能在日志里**一眼看出是哪一层坏了**。
      #    2026-11-11：node 404 / curl 200 → 以为是传输层，改用 h2。
      #    2026-11-12：两个传输层都 404、连首页都 404 → 以为是 UA；
      #                最后 A/B 出真相：**同一个 runner，Node 20 全 404、Node 22 全 200**。
      #    所以现在自检必须用与抓取相同的客户端（node），并且必须打印 Node 版本。
      - name: 出口网络自检（Node 版本 / 出口 IP / 两种 UA）
        run: node poca/_selfcheck.js

      # ⚠️ 2026-11-12 16:00 起改走 Cloudflare Worker 中转（出口不再是 Azure 机房 IP）。
      #    站方按出口 IP 归属分流：runner 直连 → 国际站后端 → 无 /card/v3 路由 → 404/39；
      #    经 Worker 出站 → 2026-11-12 16:08 实测 search/v1/sell/matching 全 200，
      #    verdict=PASS colo=IAD，20 并发 0 失败。
      #    预检打的是中转而不是站方，逻辑不变：通就抓，不通静默跳过本轮。
      - name: 通路预检（经中转探测，不通就静默跳过）
        id: gate
        run: |
          # ⚠️ 2026-11-12 17:12：Cloudflare Worker 里的 KEY 与 workflow 常量对不上过两次（403 forbidden，
          #    体长 9 字节就是 "forbidden"），改一处不行改另一处也不行 —— 与其继续猜，
          #    不如把候选 key 全试一遍，用通的那个，并把命中的 key 写进环境交给抓取步骤。
          #    这样 Worker 里是哪串都能自愈；日志会打印 key=xxx → HTTP yyy，对不上时一眼看见。
          FOUND=""
          for K in poca_9f3k2m7xq4wzv8hd; do
            CODE=$(curl -sS -m 20 -D /tmp/gate.hdr -o /tmp/gate.bin -w '%{http_code}' \
              -H 'Accept: application/json' -H "x-poca-key: $K" \
              'https://poca-proxy.1140382718.workers.dev/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4' || echo 000)
            SIZE=$(stat -c%s /tmp/gate.bin 2>/dev/null || echo 0)
            echo "key=$K → HTTP $CODE size=$SIZE"
            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 500 ]; then FOUND="$K"; break; fi
          done
          GATEBODY="$(head -c 200 /tmp/gate.bin 2>/dev/null)"

          # ⚠️⚠️ 响应头里的 poca-display-language / currency 只表示「展示偏好」，**不代表路由归属**。
          #    2026-11-12 17:54 实测：Cloudflare 出口下站方判 en/USD，v3 接口照样 200 + 韩元原值
          #    （线上 data.json：匹配价中位 4500、最高 140000，速切最高 250000，全是韩元；
          #     pchg 既没出现跌价、也没丢历史点）。而 Azure 出口同样是 en/USD，却是 404/39。
          #    所以**唯一判据只有「200 有数据 vs 404/39 NOT_FOUND」**，别看 language。
          #    打印它是为了看趋势：万一哪天 v3 开始按 display currency 把韩元换算成美元，
          #    价格会整体除以约 1350，pchg 会瞬间爆出上千条「跌价」——那时这里能对上号。
          hdr() { grep -i "^$1:" /tmp/gate.hdr 2>/dev/null | tr -d '\r' | awk '{print $2}' | head -1; }
          LANG=$(hdr 'poca-display-language')
          CURR=$(hdr 'poca-display-currency')
          SRV=$(hdr 'server')
          echo "响应头：language=${LANG:-?} currency=${CURR:-?} server=${SRV:-?}（仅供参考，不是路由判据）"
          DETAIL="HTTP $CODE · ${SIZE} 字节 · 响应头 lang=${LANG:-?} cur=${CURR:-?}"

          if [ -n "$FOUND" ]; then
            echo "✅ 中转通路正常（生效 key=$FOUND）"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "GATEKEY=$FOUND" >> "$GITHUB_ENV"
          else
            # ⚠️ 分类必须在预检这里就分清：三种「404」的处置方式完全不同，
            #    混成一个「挂了」后面就没法判断到底是限速（会自愈）、地区分流（要换出口）
            #    还是我们自己的鉴权问题（改代码）。
            #    时间型启发式，够用：体 1~2 字节 = 限速；39 字节 NOT_FOUND = 国际站后端。
            if printf '%s' "$GATEBODY" | grep -q forbidden; then
              REASON="AUTH"
            elif [ "$CODE" = "000" ]; then
              REASON="NETWORK"
            elif [ "$SIZE" -le 2 ]; then
              REASON="RATE_LIMIT"
            elif printf '%s' "$GATEBODY" | grep -q NOT_FOUND; then
              REASON="REGION"
            elif [ "${CODE#5}" != "$CODE" ]; then
              REASON="UPSTREAM_5XX"
            else
              REASON="UNKNOWN"
            fi
            echo "⏭ 中转不通（原因 $REASON）$DETAIL，本轮静默跳过"
            echo "   预检体: $GATEBODY"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "GATE_REASON=$REASON" >> "$GITHUB_ENV"
            echo "GATE_DETAIL=$DETAIL" >> "$GITHUB_ENV"
            # 我们自己代码坏了必须立刻吵，不能等 40 分钟阈值
            if [ "$REASON" = "AUTH" ]; then
              echo "GATE_URGENT=1" >> "$GITHUB_ENV"
              echo "::error::Worker 鉴权失败（403 forbidden）—— Cloudflare 里的 KEYS 被改成了非空，或与 workflow 不一致"
              exit 1
            fi
          fi

          # 批量端点单独验一次：这是我们自己的代码，坏了必须吵，不能静默跳过
          # 故意用 20 个路径探 —— 和实际批大小一致，顺便验 Worker 扛不扛得住 20 个子请求
          if [ -n "$FOUND" ]; then
            ARR=""
            for i in $(seq 1 20); do
              if [ -z "$ARR" ]; then ARR='"/card/v1/436791"'; else ARR="$ARR,\"/card/v1/436791\""; fi
            done
            BCODE=$(curl -sS -m 40 -o /tmp/gate_b.bin -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              -H "x-poca-key: $FOUND" \
              -d "{\"ps\":[$ARR]}" \
              'https://poca-proxy.1140382718.workers.dev/__batch' || echo 000)
            echo "批量端点(20路) HTTP $BCODE 大小 $(stat -c%s /tmp/gate_b.bin 2>/dev/null || echo 0)"
            echo "   体: $(head -c 160 /tmp/gate_b.bin 2>/dev/null)"
            if [ "$BCODE" != "200" ] || ! grep -q '"r"' /tmp/gate_b.bin 2>/dev/null; then
              # 同样是「我们自己的代码坏了」，立即告警，不等停更阈值
              echo "GATE_URGENT=1" >> "$GITHUB_ENV"
              echo "GATE_REASON=BATCH" >> "$GITHUB_ENV"
              echo "GATE_DETAIL=批量端点 HTTP $BCODE" >> "$GITHUB_ENV"
              echo "::error::批量端点 /__batch 不可用（HTTP $BCODE）—— Cloudflare Worker 需要重新粘贴带批量端点的代码"
              exit 1
            fi
          fi

      - name: 抓取 Poca
        if: steps.gate.outputs.ok == '1'
        env:
          POCA_Q: 장하오
          POCA_CONC: '16'
          # 走 Cloudflare Worker 中转，绕开 Azure 机房 IP 被判「国际站」
          POCA_HOST: poca-proxy.1140382718.workers.dev
          # POCA_KEY 不写死：由预检步骤探测出的 GATEKEY 提供（见上面 key 兼容逻辑）
          # 批量：一次 Worker 请求取 20 个接口 → 配额按批算，不按接口算
          POCA_BATCH: '20'
          POCA_BATCH_CONC: '2'     # 同时在飞的批数 → 等效上游并发 40
        run: |
          export POCA_KEY="$GATEKEY"
          # ✅ 2026-11-12 17:00 起：批量取把配额消耗降了 13 倍，**每轮全量，不再降频**。
          #    一轮 = 搜索 65 + 固定卡 3 + 详情 52 + 明细 67 ≈ 187 次 Worker 请求
          #    （2026 个上游接口调用被压进 119 次 Worker 请求里）。
          #    10 分钟一轮跑满一天 = 144 × 187 ≈ 2.7 万，免费额度 10 万里余量七成。
          #    --fast / POCA_DEEP_GAP 那套「快跑轮+每小时完整轮」的分工已经全部删掉。
          #
          # ⚠️⚠️ --min-gap 只能 5，绝对不能 8（2026-11-12 18:15 修）：
          #    它挡的是「同一分钟内 cron-job.org 和 GitHub cron 撞车」，
          #    而撞车的间隔是 0~1 分钟，5 分钟就够。
          #    原来设 8 会周期性把**正常的定时轮**一起吞掉：#2477（10:09:53 定时）
          #    距上一轮跑完只有 7.9 分钟 < 8 → 被判「撞车」跳过，等于实际 20 分钟才更新一次。
          #    算一下余量：:00 触发跑 75~110 秒 → :01:50 左右完成，到 :10 只剩 8.1 分钟，
          #    随便慢一点就跌破 8。改 5 之后留 3 分钟富裕。
          #    （日志里会打印「距上次成功 X 分钟 < 5，本轮跳过」，看到 X 接近 10 就说明正常。）
          if [ "${{ steps.wish.outputs.skip }}" = "1" ]; then
            node poca/poca.js --min-gap 5 --skip-wish
          else
            node poca/poca.js --min-gap 5
          fi

      - name: 确认产物
        run: |
          # 被节流跳过时没有新的 data.json，直接结束本轮（不算失败）
          if [ ! -s poca/data.json ]; then
            echo "⏭ 本轮跳过（距上次成功不足 5 分钟，节流），没有新产物"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          node -e "const d=require('./poca/data.json'); console.log('条数',d.items.length,'抓取用时',d.elapsed+'s','更新于',d.at_cn)"

      # ⚠️ 告警只做一件事：数据停了让你知道，同时不刷屏。
      #    判据是「距上次成功更新多久」，而不是「本轮成没成功」——
      #    限速一般几分钟自愈，按轮次告会 10 分钟一条，纯噪音。
      #    < 40 分钟不发；40~46 分钟发一条；之后每满 60 分钟再提醒一次。
      #    阈值、原因分类文案都在 poca/_alert.js 里，要调改那里。
      #    预检失败的原因（RATE_LIMIT / REGION / AUTH …）由上面的步骤写进 GATE_REASON。
      - name: 异常告警（停更 / 限速 / 代码问题）
        if: always()
        continue-on-error: true
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          POCA_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          JOB_STATUS: ${{ job.status }}
        run: node poca/_alert.js

      - name: 推送降价到钉钉
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          POCA_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
          POCA_NOTIFY_TAG: ${{ github.event.inputs.notify_tag }}
          # 集合图要传到 main 的 poca/notify/（poca-data 每轮 force push 会把图冲掉）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node poca/notify.js

      - name: 发布到 poca-data 分支
        if: env.SKIP != '1'
        run: |
          mkdir -p /tmp/pub
          cp poca/data.json poca/state.json /tmp/pub/
          [ -f poca/wish.json ] && cp poca/wish.json /tmp/pub/
          # 永久价格档案：单独文件，越滚越大，不能塞进 state.json
          if [ -f poca/pchg.json ]; then cp poca/pchg.json /tmp/pub/; fi
          # 永久明细档案：同样单独文件，只增不减
          if [ -f poca/darc.json ]; then cp poca/darc.json /tmp/pub/; fi
          cd /tmp/pub
          git init -q -b poca-data
          git config user.name "poca-watch-bot"
          git config user.email "poca-watch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "poca $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 每轮 force push 单个 commit：仓库历史永远只有一条，不会随小时数膨胀
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/poca-data
          echo "✅ 已发布到 poca-data"
