name: Poca 中转吞吐测试（手动）

# 上一轮探测结论：GitHub runner（Azure 美国，出口 172.174.166.196）直连韩站 404/39，
# 但走 api.allorigins.win 中转 → HTTP 200 / 7670 字节 / 含 transaction_sell_price。
# 说明站方判的是**出口 IP 归属地区**，换一条出口就通。
# 本轮验证：这个免费中转能扛多少请求、有无缓存、延迟多少 —— 决定能不能直接接管 Actions。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 中转吞吐与缓存测试
        run: |
          node -e '
          const HOST = "https://phocamarket.com";
          const PX = u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u);
          const UA = "PocaMarket/2.7.4 (iPhone; iOS 18.0)";
          const sleep = ms => new Promise(z => setTimeout(z, ms));
          async function get(u, timeout = 30000) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), timeout);
            const t0 = Date.now();
            try {
              const r = await fetch(u, { signal: c.signal, headers: { "User-Agent": UA, "Accept": "application/json" } });
              const d = await r.text();
              return { s: r.status, len: d.length, ms: Date.now() - t0, d };
            } catch (e) { return { s: 0, len: 0, ms: Date.now() - t0, d: "", err: e.name }; }
            finally { clearTimeout(t); }
          }
          (async () => {
            // 1) 拿一页搜索，取 24 个 id
            const s = await get(PX(HOST + "/card/v3/search?q=" + encodeURIComponent("장하오")));
            console.log("搜索: HTTP", s.s, "size", s.len, "ms", s.ms);
            let ids = [];
            try { ids = (JSON.parse(s.d).results || []).map(r => r.id); } catch (e) { console.log("解析失败:", s.d.slice(0, 80)); }
            console.log("拿到 id:", ids.length);
            if (!ids.length) return;

            // 2) 详情接口连打（并发 4），统计成功率与延迟
            const pick = ids.slice(0, 24);
            for (const conc of [4, 8]) {
              let ok = 0, bad = 0, ms = [], codes = {};
              let i = 0;
              const t0 = Date.now();
              async function w() {
                while (i < pick.length) {
                  const id = pick[i++];
                  const r = await get(PX(HOST + "/card/v1/" + id));
                  codes[r.s] = (codes[r.s] || 0) + 1;
                  if (r.s === 200 && r.d.trim().startsWith("{")) { ok++; ms.push(r.ms); } else bad++;
                }
              }
              await Promise.all(Array.from({ length: conc }, w));
              const total = (Date.now() - t0) / 1000;
              const avg = ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) : 0;
              const mx = ms.length ? Math.max(...ms) : 0;
              console.log(`并发${conc}: ${pick.length} 个详情 | 成功 ${ok} 失败 ${bad} | 状态码 ${JSON.stringify(codes)} | 平均 ${avg}ms 最慢 ${mx}ms | 总耗时 ${total.toFixed(1)}s`);
              console.log(`  → 推算 1036 张详情约需 ${Math.round(1036 / pick.length * total)}s`);
              await sleep(1500);
            }

            // 3) 缓存检测：同一个 id 连打 3 次
            const a = await get(PX(HOST + "/card/v1/" + pick[0]));
            const b = await get(PX(HOST + "/card/v1/" + pick[0]));
            const c = await get(PX(HOST + "/card/v1/" + pick[0]));
            console.log("同一 id 三次:", a.ms + "ms/" + a.len + "B", b.ms + "ms/" + b.len + "B", c.ms + "ms/" + c.len + "B",
              "（时间明显递减 = 有缓存，价格会停在旧值）");

            // 4) 明细接口也能过吗
            const m = await get(PX(HOST + "/card/v1/" + pick[0] + "/matching"));
            console.log("明细 matching: HTTP", m.s, "size", m.len, "|", m.d.replace(/\s+/g, " ").slice(0, 100));
            const sl = await get(PX(HOST + "/card/v1/" + pick[0] + "/sell"));
            console.log("明细 sell    : HTTP", sl.s, "size", sl.len, "|", sl.d.replace(/\s+/g, " ").slice(0, 100));
          })();
          '
