name: Poca 出口改道测试（手动）

# 已知：GitHub runner（Azure 美国）被韩站分流到国际站后端 → 整站 404/39。
# 已知：jina.ai（跑在 Cloudflare 上）能拿到韩站数据 → Cloudflare 网络出口通行。
# 本轮：在 Actions 内把出站转到 Cloudflare WARP，看出口 IP 变了能否 200。
# ⚠️ 上一版用 nohup 起 warp-plus 把 job 挂死（后台进程占住 stdout），改成全程 timeout 包裹 + 前台运行。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 基线
        run: |
          echo "当前出口: $(curl -sS -m 12 https://api.ipify.org)"
          curl -sS -m 20 -o /dev/null -w "直连韩站 HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true

      - name: 原生 WARP（wgcf + wg-quick）
        continue-on-error: true
        run: |
          cd /tmp
          timeout 70 curl -sSL -o wgcf "https://github.com/ViRb3/wgcf/releases/download/v2.2.27/wgcf_2.2.27_linux_amd64" || { echo "wgcf 下载失败"; exit 0; }
          chmod +x wgcf
          tail -c 200 wgcf | head -c 100; echo
          timeout 40 ./wgcf register --accept-tos || { echo "注册失败"; exit 0; }
          timeout 30 ./wgcf generate || { echo "生成失败"; exit 0; }
          echo "=== 配置已生成 ==="
          sudo apt-get update -qq 2>/dev/null; sudo apt-get install -y -qq wireguard-tools 2>/dev/null
          sudo timeout 45 wg-quick up /tmp/wgcf-profile.conf || echo "wg-quick 启动失败（内核模块不可用）"
          echo "WARP 出口: $(curl -sS -m 15 https://api.ipify.org)"
          echo "===== 走 WARP 打韩站 ====="
          curl -sS -m 25 -o /tmp/w.bin -D /tmp/w.hdr -w "HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true
          echo "ctx: $(grep -i '^poca-display' /tmp/w.hdr | tr -d '\r' | tr '\n' ' ')"
          echo "含报价字段: $(grep -c transaction_sell_price /tmp/w.bin || echo 0)"
          head -c 100 /tmp/w.bin; echo
          sudo timeout 30 wg-quick down /tmp/wgcf-profile.conf || true

      - name: 用户态 warp-plus（SOCKS5，前台限时）
        continue-on-error: true
        run: |
          cd /tmp
          URL=$(echo "https://github.com/bepass-org/warp-plus/releases/download/v1.2.12/warp-plus_linux-amd64.zip")
          echo "下载: $URL"
          timeout 80 curl -sSL -o wp.zip "$URL" || { echo "下载失败"; exit 0; }
          unzip -o -q wp.zip && ls -la warp-plus 2>/dev/null || { echo "解压失败"; exit 0; }
          chmod +x warp-plus
          # 前台起代理，放到后台但立刻 disown 输出，避免挂住 job
          timeout 60 ./warp-plus -b 127.0.0.1:8086 > wp.log 2>&1 &
          WPPID=$!
          sleep 20
          tail -8 wp.log
          echo "===== SOCKS5 出口 IP ====="
          curl -sS -m 20 --socks5-hostname 127.0.0.1:8086 https://api.ipify.org || echo "  socks 不通"
          echo
          echo "===== 走 SOCKS5 打韩站 ====="
          curl -sS -m 25 --socks5-hostname 127.0.0.1:8086 -o w2.bin -D w2.hdr \
            -w "HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true
          echo "ctx: $(grep -i '^poca-display' w2.hdr | tr -d '\r' | tr '\n' ' ')"
          echo "含报价字段: $(grep -c transaction_sell_price w2.bin || echo 0)"
          head -c 100 w2.bin; echo
          kill $WPPID 2>/dev/null || true
