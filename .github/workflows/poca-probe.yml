name: Poca 接口探测（排障用，手动触发）

# 2026-11-12 13:31 起的故障：站方按**来源 IP 归属地区**分流。
#   同一份代码 / 同 Node22 / 同 App UA：
#     #2431 40.76.117.227 → 200      #2432 4.249.22.2   → 200
#     #2433 68.220.61.181 → 404      #2434 52.183.219.66 → 404
#     #2435 20.169.68.242 → 404      #2436 20.14.214.53  → 404
#   本地（中国出口）同一 URL → 200，首页 32982 字节。
# 已排除：GeoDNS（runner 解析到的是真实源站，强制 --resolve 两台都 404）、
#         网络封禁（同 runner 上 api.pocamarket.com 全球站 200）、
#         请求头伪装（POCA-LANGUAGE/POCA-CURRENCY/Cookie/XFF 八种组合全 404，
#         响应头 poca-display-language 恒为 en、currency 恒为 USD）。
# 本探测找**替代出口/替代数据源**，不再纠缠请求特征。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: IPv6 出站（换一条源 IP）
        continue-on-error: true
        run: |
          UA='PocaMarket/2.7.4 (iPhone; iOS 18.0)'
          U='https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4'
          echo "===== 有没有 IPv6 地址 ====="
          ip -6 addr show scope global 2>/dev/null | head -10 || echo "无全局 IPv6"
          node -e "require('dns').resolve6('phocamarket.com',(e,a)=>console.log('phocamarket AAAA:',e?e.code:a))"
          echo "===== IPv6 出口 IP ====="
          curl -6 -sS -m 15 https://api64.ipify.org 2>&1 || echo "IPv6 不可用"
          echo
          echo "===== 强制 IPv6 访问搜索 ====="
          curl -6 -sS -m 20 -o /tmp/s6.bin -w "HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: $UA" -H "Accept: application/json" "$U" 2>&1 || echo "IPv6 请求失败"
          head -c 100 /tmp/s6.bin 2>/dev/null; echo

      - name: 全球站能不能给韩元
        continue-on-error: true
        run: |
          UA='PocaMarket/2.7.4 (iPhone; iOS 18.0)'
          B='https://api.pocamarket.com/card/gb/v2/search?q=%EC%9E%A5%ED%95%98%EC%98%A4'
          try() {
            local name="$1"; shift
            curl -sS -m 20 -o /tmp/g.bin -w "%{http_code}" "$@" "$B" >/tmp/code 2>/dev/null || true
            printf '%-42s HTTP %-4s ' "$name" "$(cat /tmp/code)"
            node -e "
            try{const j=require('/tmp/g.bin');const a=(j.data&&j.data.results)||[];
              const x=a.find(r=>r.price)||a[0]||{};
              console.log('count='+(j.data&&j.data.count), '| display_currency='+x.display_currency, '| price='+x.price, '| localized='+x.discounted_price_localized);
            }catch(e){console.log('解析失败')}"
          }
          try "① 基线（USD）"            -H "Accept: application/json" -H "User-Agent: $UA"
          try "② POCA-CURRENCY: KRW"     -H "Accept: application/json" -H "User-Agent: $UA" -H "POCA-CURRENCY: KRW"
          try "③ POCA-LANGUAGE: ko"      -H "Accept: application/json" -H "User-Agent: $UA" -H "POCA-LANGUAGE: ko"
          try "④ 两个都带"                -H "Accept: application/json" -H "User-Agent: $UA" -H "POCA-LANGUAGE: ko" -H "POCA-CURRENCY: KRW"
          echo
          echo "===== 全球站单卡详情（看有没有韩元）====="
          ID=$(node -e "const j=require('/tmp/g.bin');console.log(((j.data&&j.data.results)||[{}])[0].id||'')" 2>/dev/null)
          echo "样本 id=$ID"
          for p in "/card/gb/v1/$ID" "/card/v1/$ID"; do
            printf '%-28s ' "$p"
            curl -sS -m 20 -o /tmp/d.bin -w "HTTP %{http_code} size=%{size_download}" \
              -H "Accept: application/json" -H "User-Agent: $UA" "https://api.pocamarket.com$p" || true
            echo " | $(head -c 80 /tmp/d.bin | tr -d '\n')"
          done

      - name: 站方是否在做灰度（连续打 6 次看会不会翻）
        continue-on-error: true
        run: |
          UA='PocaMarket/2.7.4 (iPhone; iOS 18.0)'
          U='https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4'
          for i in 1 2 3 4 5 6; do
            printf '#%d ' $i
            curl -sS -m 20 -o /dev/null -D /tmp/r.hdr -w "HTTP %{http_code} size=%{size_download}" \
              -H "User-Agent: $UA" -H "Accept: application/json" "$U" || true
            echo " ip=$(curl -sS -m 8 https://api.ipify.org 2>/dev/null)"
            sleep 2
          done
