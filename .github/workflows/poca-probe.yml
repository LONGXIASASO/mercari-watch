name: Poca 出口改道测试（手动）

# 已证实：GitHub runner（Azure 美国）→ 韩站 404/39，是**出口地区**问题，跟代码无关。
# 已排除：WARP 隧道（出口 104.28.227.106 建连成功，但访问韩站 25s 超时——韩站封了 WARP 网段）。
# 已证实：jina.ai（跑在 Cloudflare Workers 上）能取到韩站 JSON → **CF 边缘出口是通的**。
# 本轮：测几个跑在 Cloudflare 上的公共 CORS 代理。任一稳定可用 → Actions 立刻复活，你不用做任何事。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 公共 CF 代理穿透测试
        run: |
          node -e '
          const U = "https://phocamarket.com/card/v3/search?q=" + encodeURIComponent("장하오");
          const UA = "PocaMarket/2.7.4 (iPhone; iOS 18.0)";
          const enc = encodeURIComponent(U);
          const cands = [
            ["test.cors.workers.dev", "https://test.cors.workers.dev/?" + U],
            ["cors.eu.org",           "https://cors.eu.org/" + U],
            ["cors.isomorphic-git",   "https://cors.isomorphic-git.org/" + U],
            ["allorigins",            "https://api.allorigins.win/raw?url=" + enc],
            ["corsproxy.garmeeh",     "https://corsproxy.garmeeh.workers.dev/?" + U],
            ["cf-cors-proxy",         "https://cors-proxy.deno.dev/?" + U],
            ["yacdn",                 "https://yacdn.org/proxy/" + U],
          ];
          (async () => {
            for (const [name, url] of cands) {
              const t0 = Date.now();
              const c = new AbortController();
              const to = setTimeout(() => c.abort(), 25000);
              try {
                const r = await fetch(url, { signal: c.signal, headers: { "User-Agent": UA, Accept: "application/json" } });
                const d = await r.text();
                const hit = d.includes("transaction_sell_price");
                console.log(
                  (hit ? "✅" : "  "), name.padEnd(22),
                  "HTTP", String(r.status).padEnd(4),
                  "size=" + String(d.length).padEnd(7),
                  "报价字段=" + (hit ? "有" : "无"),
                  (Date.now() - t0) + "ms",
                  hit ? "" : "| " + d.replace(/\s+/g, " ").slice(0, 70)
                );
              } catch (e) {
                console.log("  ", name.padEnd(22), "失败", e.name, (Date.now() - t0) + "ms");
              } finally { clearTimeout(to); }
            }

            // 稳的那个再连打 8 次，看会不会 429 / 有没有缓存
            console.log("\n===== 连打 8 次（看稳定性与缓存）=====");
            const target = "https://test.cors.workers.dev/?" + U;
            const times = [], lens = [];
            for (let i = 0; i < 8; i++) {
              const t0 = Date.now();
              const c = new AbortController();
              const to = setTimeout(() => c.abort(), 20000);
              try {
                const r = await fetch(target, { signal: c.signal, headers: { "User-Agent": UA } });
                const d = await r.text();
                times.push(Date.now() - t0); lens.push(d.length);
                process.stdout.write(r.status + "(" + d.length + "B," + (Date.now() - t0) + "ms) ");
              } catch (e) { process.stdout.write("ERR(" + e.name + ") "); }
              finally { clearTimeout(to); }
              await new Promise(z => setTimeout(z, 400));
            }
            console.log("\n长度是否恒定:", new Set(lens).size === 1 ? "恒定（可能有缓存）" : "变化（实时）");
          })();
          '
