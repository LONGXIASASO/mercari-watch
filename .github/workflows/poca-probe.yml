name: Poca 接口探测（临时排障）

# 只在需要排查时手动触发，不参与定时任务、不碰任何数据文件。
# 3 个并行 job = 3 台 runner = 3 个出口 IP，用来判断「失败是不是跟出口 IP 有关」。
on:
  workflow_dispatch: {}

jobs:
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - name: 拉代码
        uses: actions/checkout@v4
      - name: 出口 IP + 两种 UA
        continue-on-error: true
        run: node poca/_probe5.js
