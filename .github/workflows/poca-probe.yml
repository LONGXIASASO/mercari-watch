name: Poca 出口改道测试（手动）

# 已知：GitHub runner 出口（Azure 美国）被韩站分流到国际站后端 → 整站 404/39。
# 已知：jina.ai（跑在 Cloudflare 上）能拿到韩站数据 → **Cloudflare 网络的出口是通行的**。
# 本轮测：在 Actions 内把出站流量转到 Cloudflare WARP，看出口 IP 变了之后能不能直接 200。
# 两条路都试：① 原生 WireGuard（wgcf）② 用户态 warp-plus。任一成功 → Actions 可复活。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 基线
        run: |
          echo "当前出口: $(curl -sS -m 12 https://api.ipify.org)"
          curl -sS -m 20 -o /dev/null -w "直连韩站 HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true

      - name: ① 原生 WARP（wgcf + wg-quick）
        id: wg
        continue-on-error: true
        run: |
          set -x
          curl -sSL -m 60 -o /tmp/wgcf "https://github.com/ViRb3/wgcf/releases/download/v2.2.27/wgcf_2.2.27_linux_amd64" || exit 0
          chmod +x /tmp/wgcf
          cd /tmp
          ./wgcf register --accept-tos || exit 0
          ./wgcf generate || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          # WARP 内核在部分云 VM 上不支持，超时就放弃
          sudo timeout 40 wg-quick up /tmp/wgcf-profile.conf || echo "wg-quick 启动失败"
          echo "WARP 出口: $(curl -sS -m 15 https://api.ipify.org)"
          echo "===== 走 WARP 打韩站 ====="
          curl -sS -m 25 -o /tmp/w.bin -D /tmp/w.hdr -w "HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true
          echo "ctx: $(grep -i '^poca-display' /tmp/w.hdr | tr -d '\r' | tr '\n' ' ')"
          echo "含报价字段: $(grep -c transaction_sell_price /tmp/w.bin || echo 0)"
          head -c 100 /tmp/w.bin; echo
          sudo wg-quick down /tmp/wgcf-profile.conf || true

      - name: ② 用户态 warp-plus（SOCKS5，不需内核模块）
        continue-on-error: true
        run: |
          URL=$(curl -sS -m 20 https://api.github.com/repos/bepass-org/warp-plus/releases/latest \
            | grep -o 'https://[^"]*linux-amd64[^"]*\.zip' | head -1)
          echo "下载: $URL"
          [ -z "$URL" ] && exit 0
          curl -sSL -m 90 -o /tmp/wp.zip "$URL" && cd /tmp && unzip -o -q wp.zip && ls -la /tmp/warp-plus* 2>/dev/null
          chmod +x /tmp/warp-plus 2>/dev/null || true
          nohup /tmp/warp-plus -b 127.0.0.1:8086 > /tmp/wp.log 2>&1 &
          sleep 12
          tail -6 /tmp/wp.log
          echo "===== SOCKS5 出口 IP ====="
          curl -sS -m 20 --socks5-hostname 127.0.0.1:8086 https://api.ipify.org || echo "socks 不通"
          echo
          echo "===== 走 WARP 打韩站 ====="
          curl -sS -m 25 --socks5-hostname 127.0.0.1:8086 -o /tmp/w2.bin -D /tmp/w2.hdr \
            -w "HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: PocaMarket/2.7.4 (iPhone; iOS 18.0)" -H "Accept: application/json" \
            "https://phocamarket.com/card/v3/search?q=%EC%9E%A5%ED%95%98%EC%98%A4" || true
          echo "ctx: $(grep -i '^poca-display' /tmp/w2.hdr | tr -d '\r' | tr '\n' ' ')"
          echo "含报价字段: $(grep -c transaction_sell_price /tmp/w2.bin || echo 0)"
          head -c 100 /tmp/w2.bin; echo
