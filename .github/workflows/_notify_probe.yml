name: 钉钉推送探针（排查用）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '测试标记'
        required: false
        default: '探针'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 复刻真实消息的 3 个变体
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          MD_B64: ''
        run: |
          cat > /tmp/probe.js <<'PROBE_EOF'
const crypto=require("crypto");
const WH=process.env.DINGTALK_WEBHOOK||"";
const SEC=process.env.DINGTALK_SECRET||"";
const md=Buffer.from(process.env.MD_B64,"base64").toString("utf8");
const url=()=>{ if(!SEC) return WH; const ts=Date.now();
  const sign=crypto.createHmac("sha256",SEC).update(ts+"\n"+SEC).digest("base64");
  return WH+(WH.includes("?")?"&":"?")+"timestamp="+ts+"&sign="+encodeURIComponent(sign); };
const post=(b)=>fetch(url(),{method:"POST",headers:{"Content-Type":"application/json; charset=utf-8"},body:JSON.stringify(b)}).then(r=>r.text()).catch(e=>"ERR "+e.message);
(async()=>{
  const noImg=md.split("\n").filter(l=>!l.trim().startsWith("![")).join("\n");
  const asciiTitle=md.replace(/^### .*/, "### Poca price drop 2");
  const cases=[["A_完整原样",md],["B_标题换英文",asciiTitle],["C_去掉图片行",noImg]];
  for(const c of cases){
    const r=await post({msgtype:"markdown",markdown:{title:"探针 "+c[0],text:c[1]}});
    console.log(c[0]+" | 字节"+Buffer.byteLength(c[1])+" -> "+String(r).slice(0,140));
    await new Promise(z=>setTimeout(z,3000));
  }
})();
PROBE_EOF
          node /tmp/probe.js
