name: 美区探测

# 只为验证一件事：订阅里的美国节点 + 真 Chrome 能不能过美区 Cloudflare。
# 跑通之后换成正式的 us-watch.yml。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Xray（订阅里的美国节点）
        env:
          POCA_SUB_URL: ${{ secrets.POCA_SUB_URL }}
        run: |
          set -o pipefail
          curl -sSL -m 180 -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p /tmp/xray && unzip -oq /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          node us/_sub2xray_us.js --out /tmp/xray.json --port 7891 2>&1 | head -40
          if [ ! -s /tmp/xray.json ]; then echo "::error::订阅解析失败"; exit 1; fi
          nohup /tmp/xray/xray -c /tmp/xray.json > /tmp/xray.log 2>&1 &
          sleep 6
          tail -5 /tmp/xray.log || true

      - name: 找能用的美国出口
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/xray.json'))['inbounds']))")
          echo "节点数: $N"
          PICK=""
          for i in $(seq 0 $((N-1))); do
            P=$((7891+i))
            R=$(curl -s -m 8 -x http://127.0.0.1:$P https://ipinfo.io/json || true)
            CC=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('country',''))" 2>/dev/null || echo "")
            CITY=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('city',''))" 2>/dev/null || echo "")
            ORG=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('org',''))" 2>/dev/null || echo "")
            echo "  :$P → ${CC:-x} ${CITY} ${ORG}"
            if [ "$CC" = "US" ]; then PICK=$P; echo "  ✅ 选中 :$P"; break; fi
          done
          if [ -z "$PICK" ]; then echo "::error::订阅里没有可用的美国节点"; exit 1; fi
          echo "US_PROXY=http://127.0.0.1:$PICK" >> $GITHUB_ENV

      - name: 装 Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg xvfb >/dev/null
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable >/dev/null
          google-chrome --version

      - name: 探测（真 Chrome + CDP）
        run: |
          echo "用代理: $US_PROXY"
          xvfb-run -a --server-args="-screen 0 1366x900x24" node us/us_probe_gh.js || true
          echo "===== 结果 ====="
          cat /tmp/us_probe_result.json 2>/dev/null || echo "无结果文件"
