name: 煤炉小卡监控

# 定时说明（cron 用的是 UTC，比北京时间慢 8 小时）
# UTC 1-17 点 = 北京时间 9:00 ~ 次日 1:00；北京时间 2:00-8:00 不跑
#
# ★ 分钟数为什么是 03 / 23 / 43，而不是整十整二十（2026-10-23 改）
#   现在有三条闹钟同时在打 dispatch：
#     cron-job.org（主）  :08 :18 :28 :38 :48 :58   ← 每 10 分钟，用户在网页配
#     本机计划任务（备）  :00 :20 :40                ← 每 20 分钟，工作日 9-20 点
#     GitHub 自带（兜底） :03 :23 :43                ← 就是这一行
#   原来三条全压在 :00 / :20 / :40 上，同一分钟进来两个 dispatch，
#   后到的会被 concurrency 排队，等前一轮跑完再空跑一遍（一轮占 2~3 分钟机器时间）。
#   把这一行往后挪 3 分钟，三条的最小间隔就拉到 5 分钟，互不等待。
#
# ⚠️ 改这一行时，务必和另外两条错开，别再落回 :08 :18 :28 或 :00 :20 :40。
#
# 为什么不是每小时只跑一次：
#   GitHub 的定时任务不保证准时（整点最挤，可能推迟几十分钟），
#   偶尔还会落到被煤炉封了 IP 的机房（实测 westus3 抓不到，eastus 正常）。
#   每 20 分钟醒一次，碰上被挡或延迟，后面几次会自动重试补上。
on:
  schedule:
    - cron: '3,23,43 1-17 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '手动补抓：往回看几小时（留空则自动按上次运行时间推算）'
        required: false
        default: ''
        type: string

# 同一时间只跑一个，避免两次抓取互相覆盖
concurrency:
  group: mercari-card-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 抓取并写出静态快照
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.hours }}" ]; then
            node run.js --hours "${{ github.event.inputs.hours }}"
          else
            node run.js
          fi

      - name: 提交商品图、状态与快照
        run: |
          git config user.name "mercari-watch-bot"
          git config user.email "mercari-watch-bot@users.noreply.github.com"
          # 两轮撞在一起时（GitHub 自己的定时器和外部定时器同时醒），
          # 原来的 --force-with-lease 会因为「stale info」被拒，这轮下载的图就白丢了。
          # 现在的做法：先把本轮写好的 state.json / mw.json 挪到一边 → 硬重置到远端最新
          # （新下载的图是未跟踪文件，硬重置不会删它们）→ 放回来 → amend 到同一个 commit 上推走。
          # 最多试 3 次。用 --amend 是为了让仓库永远只有一个 commit，历史不随轮次膨胀。
          #
          # ⚠️ mw.json 是页面唯一的数据源（2026-10-26 起不走云库），
          #    必须和 state.json 一样先备份再 reset，否则这轮的数据会被远端的旧版覆盖回去。
          cp state.json /tmp/state.new.json
          cp mw.json /tmp/mw.new.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.new.json state.json
            cp /tmp/mw.new.json mw.json
            git add -A imgs state.json mw.json
            if git diff --cached --quiet; then
              echo "本轮没有图片、状态或快照变化，跳过提交"
              exit 0
            fi
            git commit --amend --no-edit
            if git push --force-with-lease origin HEAD:main; then
              echo "第 $i 次尝试：提交成功"
              exit 0
            fi
            echo "第 $i 次尝试：远端刚被别人推过，5 秒后重试"
            sleep 5
          done
          echo "⚠ 三次都没推上去，这轮的数据下次会被补回"

      - name: 汇总
        if: always()
        run: |
          echo "### 本轮抓取" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 图片库：$(ls imgs 2>/dev/null | grep -v gitkeep | wc -l) 张" >> $GITHUB_STEP_SUMMARY
          echo "- 快照：$(ls -lh mw.json 2>/dev/null | awk '{print $5}')（$(node -e "try{const s=require('./mw.json');console.log(s.items.length+' 条 / 更新 '+s.at)}catch(e){console.log('无')}")）" >> $GITHUB_STEP_SUMMARY
          echo "- 页面：https://mercari-card-watch.app.workbuddy.host/?sharecode=L2A6N4ATZQ" >> $GITHUB_STEP_SUMMARY
