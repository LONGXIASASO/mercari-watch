name: 煤炉小卡监控

# 定时说明（cron 用的是 UTC，比北京时间慢 8 小时）
# UTC 1-17 点 = 北京时间 9:00 ~ 次日 1:00；北京时间 2:00-8:00 不跑
#
# 为什么是每 20 分钟而不是每小时：
#   GitHub 的定时任务不保证准时（整点最挤，可能推迟几十分钟），
#   而且偶尔会落到被煤炉封了 IP 的机房（实测 westus3 抓不到，eastus 正常）。
#   所以让脚本每 20 分钟醒一次，但内部有「距上次成功不到 45 分钟就跳过」的判断，
#   正常情况一小时只真跑一次；碰上被挡或延迟，后面几次会自动重试补上。
on:
  schedule:
    - cron: '*/20 1-17 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '手动补抓：往回看几小时（留空则自动按上次运行时间推算）'
        required: false
        default: ''
        type: string

# 同一时间只跑一个，避免两次抓取互相覆盖
concurrency:
  group: mercari-card-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 抓取并推送云端
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.hours }}" ]; then
            node run.js --hours "${{ github.event.inputs.hours }}"
          else
            node run.js
          fi

      - name: 提交商品图与状态
        run: |
          git config user.name "mercari-watch-bot"
          git config user.email "mercari-watch-bot@users.noreply.github.com"
          git add -A imgs state.json
          if git diff --cached --quiet; then
            echo "本轮没有图片或状态变化，跳过提交"
            exit 0
          fi
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:main

      - name: 汇总
        if: always()
        run: |
          echo "### 本轮抓取" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 图片库：$(ls imgs 2>/dev/null | grep -v gitkeep | wc -l) 张" >> $GITHUB_STEP_SUMMARY
          echo "- 页面：https://mercari-card-watch.app.workbuddy.host/?sharecode=L2A6N4ATZQ" >> $GITHUB_STEP_SUMMARY
